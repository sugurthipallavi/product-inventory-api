services:

  flask_app:
    container_name: product_flask_app
    build: .
    image: product-inventory-api:1.0.0
    ports:
      - "4000:4000"
    environment:
      - DB_URL=postgresql://postgres:postgres@product_db:5432/postgres
    depends_on:
      - product_db

  product_db:
    container_name: product_db
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_DB=postgres
    volumes:
      - product_pgdata:/var/lib/postgresql/data

volumes:
  product_pgdata: